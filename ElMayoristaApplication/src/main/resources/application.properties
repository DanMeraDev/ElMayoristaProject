# ===============================================
# COMMON CONFIGURATION (all profiles)
# ===============================================

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.open-in-view=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.from=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}

# App
app.frontend.url=${APP_FRONTEND_URL}

# Webservices.ec (WhatsApp)
webservices.api.token=${WEBSERVICES_EC_TOKEN}

# Zampisoft (Cédula / RUC)
zampisoft.api.token=${ZAMPISOFT_TOKEN}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cookie
app.cookie.secure=${APP_COOKIE_SECURE:false}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# ===============================================
# CLOUDFLARE R2 CONFIGURATION
# ===============================================
spring.cloud.aws.s3.endpoint=${R2_ENDPOINT}
spring.cloud.aws.s3.bucket=${R2_BUCKET}
spring.cloud.aws.credentials.access-key=${R2_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${R2_SECRET_KEY}
spring.cloud.aws.region.static=auto
app.r2.public-url=${R2_PUBLIC_URL}
spring.cloud.aws.s3.path-style-access-enabled=true