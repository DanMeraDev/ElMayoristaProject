# ===============================================
# DEVELOPMENT PROFILE
# ===============================================

# Hibernate: validate schema against entities (Flyway handles migrations)
spring.jpa.hibernate.ddl-auto=update

# SQL logging handled by Hibernate DEBUG logger (logback config)
spring.jpa.show-sql=false

# Cookie: not secure in dev (no HTTPS)
app.cookie.secure=false

# Flyway: baseline existing databases
spring.flyway.baseline-on-migrate=true

# Tokens: inherited from application.properties (env vars)
# Set WEBSERVICES_EC_TOKEN and ZAMPISOFT_TOKEN in your .env or environment
