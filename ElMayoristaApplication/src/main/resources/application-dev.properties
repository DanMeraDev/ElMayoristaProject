# ===============================================
# DEVELOPMENT PROFILE
# ===============================================

# Hibernate: validate schema against entities (Flyway handles migrations)
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in dev for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cookie: not secure in dev (no HTTPS)
app.cookie.secure=false

# Flyway: baseline existing databases
spring.flyway.baseline-on-migrate=true
