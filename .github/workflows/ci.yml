name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ElMayoristaApplication

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: el_mayorista_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d el_mayorista_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/el_mayorista_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbg==
          APP_COOKIE_SECURE: false
          APP_FRONTEND_URL: http://localhost:5173
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: test
          OPENAI_API_KEY: sk-test
          R2_ACCESS_KEY: test
          R2_SECRET_KEY: test
          R2_ENDPOINT: https://test.r2.cloudflarestorage.com
          R2_BUCKET: test-bucket
          R2_PUBLIC_URL: https://test.r2.dev
        run: chmod +x mvnw && ./mvnw verify -B

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mayorista-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mayorista-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
